[package]
name = "kokoro-sapi"
version = "0.1.0"
edition = "2021"
description = "Kokoro TTS as a Windows SAPI5 voice (per-user, no admin)"
license = "MIT"

[lib]
name = "kokoro_sapi"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Speech",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }
windows-core = "0.61"
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic"] }
libloading = "0.8"
serde_json = "1"
anyhow = "1"

# setup binary only (downloads go through Windows' bundled curl.exe)
winreg = "0.52"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-manifest = "1"

[profile.release]
opt-level = 3
lto = true
